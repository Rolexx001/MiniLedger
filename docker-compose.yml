version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: miniledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miniledger
    ports:
      - "5432:5432"
    volumes:
      - miniledger_pgdata:/var/lib/postgresql/data

volumes:
  miniledger_pgdata:
